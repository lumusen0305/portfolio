  <path d="M150 600 C250 600 250 510 360 510 C470 510 470 600 580 600" fill="none" stroke="#ff9f0a" stroke-width="3"/>
  <path d="M250 600 C350 600 350 525 460 525 C570 525 570 600 700 600" fill="none" stroke="#ff375f" stroke-width="3"/>
  <text x="138" y="510" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#7b6a6a">KL-divergence</text>

  <!-- lock / RTL crypto block -->
  <rect x="810" y="180" width="320" height="420" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <g transform="translate(905,250)" stroke="#ff375f" stroke-width="5" fill="none">
