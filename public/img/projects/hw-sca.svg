  <polyline points="140,310 170,265 200,300 230,330 260,275 290,350 320,260 350,330 380,290 410,360 440,255 470,320 500,285 530,345 560,270 590,335 620,290 650,330 680,260 710,340 740,300" fill="none" stroke="#ff375f" stroke-width="2.5" stroke-linejoin="round" opacity="0.85"/>
