      <stop offset="0" stop-color="#160c0c"/>
      <stop offset="1" stop-color="#080810"/>
    </linearGradient>
    <radialGradient id="sca-glow" cx="0.82" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#ff375f" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#ff9f0a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/>
