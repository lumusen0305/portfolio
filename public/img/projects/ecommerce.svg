<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="E-commerce backend preview">
  <defs>
    <linearGradient id="ec-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a16"/>
      <stop offset="1" stop-color="#080810"/>
    </linearGradient>
    <radialGradient id="ec-glow" cx="0.18" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#bf5af2" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ff9f0a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ec-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bf5af2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff9f0a" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#ec-bg)"/>
  <rect width="1200" height="750" fill="url(#ec-glow)"/>

  <circle cx="46" cy="44" r="7" fill="#ff5f57"/>
  <circle cx="72" cy="44" r="7" fill="#febc2e"/>
  <circle cx="98" cy="44" r="7" fill="#28c840"/>

  <!-- search bar -->
  <rect x="120" y="110" width="700" height="56" rx="28" fill="#15101c" stroke="#ffffff" stroke-opacity="0.10"/>
  <circle cx="158" cy="138" r="12" fill="none" stroke="#9aa0ac" stroke-width="3"/>
  <line x1="167" y1="147" x2="178" y2="158" stroke="#9aa0ac" stroke-width="3" stroke-linecap="round"/>
  <text x="196" y="146" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#6a6473">search “golden retriever food”…</text>
  <rect x="690" y="122" width="116" height="32" rx="16" fill="#bf5af2" fill-opacity="0.2"/>
  <text x="708" y="144" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#d9a8f5">Elastic</text>

  <!-- cart -->
  <g transform="translate(1010,120)">
    <path d="M0 6 h14 l16 56 h64 l16 -40 h-86" fill="none" stroke="#e7d3f5" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="40" cy="78" r="8" fill="#e7d3f5"/><circle cx="86" cy="78" r="8" fill="#e7d3f5"/>
    <circle cx="92" cy="6" r="15" fill="#ff375f"/><text x="92" y="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#fff" font-weight="700">3</text>
  </g>

  <!-- product grid 3 x 2 -->
  <g>
    <!-- row 1 -->
    <g transform="translate(120,210)">
      <rect width="320" height="240" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="20" y="20" width="280" height="140" rx="12" fill="url(#ec-card)" opacity="0.55"/>
      <line x1="20" y1="186" x2="220" y2="186" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round"/>
      <text x="20" y="224" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#cdb6df">$24.00</text>
    </g>
    <g transform="translate(460,210)">
      <rect width="320" height="240" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="20" y="20" width="280" height="140" rx="12" fill="url(#ec-card)" opacity="0.4"/>
      <line x1="20" y1="186" x2="180" y2="186" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round"/>
      <text x="20" y="224" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#cdb6df">$12.50</text>
    </g>
    <g transform="translate(800,210)">
      <rect width="280" height="240" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="20" y="20" width="240" height="140" rx="12" fill="url(#ec-card)" opacity="0.5"/>
      <line x1="20" y1="186" x2="170" y2="186" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round"/>
      <text x="20" y="224" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#cdb6df">$39.90</text>
    </g>
  </g>

  <!-- order/email notification chip -->
  <g transform="translate(120,490)">
    <rect width="420" height="64" rx="16" fill="#15101c" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="18" y="18" width="44" height="30" rx="6" fill="none" stroke="#bf5af2" stroke-width="3"/>
    <path d="M18 20 l22 18 l22 -18" fill="none" stroke="#bf5af2" stroke-width="3"/>
    <text x="82" y="40" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#b9b0c6">order confirmed · email sent</text>
  </g>
  <g transform="translate(560,490)">
    <rect width="200" height="64" rx="16" fill="#15101c" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="40" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#b9b0c6">JPA · MySQL</text>
  </g>

  <text x="120" y="630" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#8a93a3">Pet-Shop Store</text>
  <text x="120" y="662" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#4d5563">Spring Boot · Elasticsearch search · uploads · email · orders</text>
</svg>
