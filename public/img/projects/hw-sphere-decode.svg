  </g>

  <!-- QAM constellation -->
  <rect x="470" y="170" width="300" height="300" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="620" y1="180" x2="620" y2="460" stroke="#ffffff" stroke-opacity="0.12"/><line x1="480" y1="320" x2="760" y2="320" stroke="#ffffff" stroke-opacity="0.12"/>
  <g fill="#64d2ff">
    <circle cx="530" cy="230" r="6"/><circle cx="590" cy="230" r="6"/><circle cx="650" cy="230" r="6"/><circle cx="710" cy="230" r="6"/>
    <circle cx="530" cy="290" r="6"/><circle cx="590" cy="290" r="6"/><circle cx="650" cy="290" r="6"/><circle cx="710" cy="290" r="6"/>
    <circle cx="530" cy="350" r="6"/><circle cx="590" cy="350" r="6"/><circle cx="650" cy="350" r="6"/><circle cx="710" cy="350" r="6"/>
    <circle cx="530" cy="410" r="6"/><circle cx="590" cy="410" r="6"/><circle cx="650" cy="410" r="6"/><circle cx="710" cy="410" r="6"/>
  </g>
  <text x="478" y="160" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#5a6573">16-QAM · MIMO detect</text>

  <!-- pipeline stages -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#7b8aa0">
    <text x="820" y="200">8-stage pipeline</text>
