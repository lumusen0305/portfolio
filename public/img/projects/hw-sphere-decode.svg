<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sphere decoder ASIC preview">
  <defs>
    <linearGradient id="sd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f18"/>
      <stop offset="1" stop-color="#080810"/>
    </linearGradient>
    <radialGradient id="sd-glow" cx="0.2" cy="0.15" r="0.95">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#64d2ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#64d2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sd-bg)"/>
  <rect width="1200" height="750" fill="url(#sd-glow)"/>

  <circle cx="46" cy="44" r="7" fill="#ff5f57"/><circle cx="72" cy="44" r="7" fill="#febc2e"/><circle cx="98" cy="44" r="7" fill="#28c840"/>
  <text x="150" y="50" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#4f5b6a">sphere_decoder.v — synth</text>

  <!-- tree search (8 layers), best path highlighted -->
  <g stroke="#2b3a4f" stroke-width="1.5">
    <line x1="160" y1="150" x2="120" y2="230"/><line x1="160" y1="150" x2="200" y2="230"/>
    <line x1="120" y1="230" x2="90" y2="310"/><line x1="120" y1="230" x2="170" y2="310"/>
    <line x1="200" y1="230" x2="250" y2="310"/><line x1="200" y1="230" x2="160" y2="310"/>
    <line x1="170" y1="310" x2="150" y2="390"/><line x1="170" y1="310" x2="220" y2="390"/>
    <line x1="250" y1="310" x2="300" y2="390"/><line x1="250" y1="310" x2="230" y2="390"/>
    <line x1="220" y1="390" x2="210" y2="470"/><line x1="220" y1="390" x2="270" y2="470"/>
    <line x1="300" y1="390" x2="340" y2="470"/>
  </g>
  <!-- highlighted best path -->
  <polyline points="160,150 200,230 250,310 220,390 270,470 300,540" fill="none" stroke="#0a84ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0c1420" stroke="#3a4a60" stroke-width="2">
    <circle cx="160" cy="150" r="13"/><circle cx="120" cy="230" r="11"/><circle cx="90" cy="310" r="10"/>
    <circle cx="170" cy="310" r="10"/><circle cx="150" cy="390" r="10"/><circle cx="340" cy="470" r="10"/><circle cx="210" cy="470" r="10"/>
  </g>
  <g fill="#0a84ff">
