  <g>
    <rect x="820" y="220" width="300" height="34" rx="6" fill="#0a84ff" fill-opacity="0.14" stroke="#0a84ff" stroke-opacity="0.4"/>
    <line x1="857" y1="220" x2="857" y2="254" stroke="#0a84ff" stroke-opacity="0.4"/><line x1="894" y1="220" x2="894" y2="254" stroke="#0a84ff" stroke-opacity="0.4"/><line x1="931" y1="220" x2="931" y2="254" stroke="#0a84ff" stroke-opacity="0.4"/><line x1="968" y1="220" x2="968" y2="254" stroke="#0a84ff" stroke-opacity="0.4"/><line x1="1005" y1="220" x2="1005" y2="254" stroke="#0a84ff" stroke-opacity="0.4"/><line x1="1042" y1="220" x2="1042" y2="254" stroke="#0a84ff" stroke-opacity="0.4"/><line x1="1079" y1="220" x2="1079" y2="254" stroke="#0a84ff" stroke-opacity="0.4"/>
  </g>

  <!-- metrics -->
  <g font-family="ui-monospace,Menlo,monospace">
    <rect x="820" y="300" width="300" height="80" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="844" y="338" font-size="30" font-weight="700" fill="#e8edf4">0.71 ns</text><text x="844" y="364" font-size="14" fill="#6b7686">cycle time</text>
    <rect x="820" y="396" width="300" height="80" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="844" y="434" font-size="30" font-weight="700" fill="#e8edf4">42,337 µm²</text><text x="844" y="460" font-size="14" fill="#6b7686">core area · 4-best search</text>
  </g>

  <text x="150" y="640" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#8a93a3">Sphere Decoder (ASIC)</text>
  <text x="150" y="672" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#4d5563">Verilog · MIMO detection · 4-best · 8-stage pipeline</text>
