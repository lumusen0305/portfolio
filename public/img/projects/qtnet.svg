<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QTNet reinforcement learning preview">
  <defs>
    <linearGradient id="qt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140e0a"/>
      <stop offset="1" stop-color="#080810"/>
    </linearGradient>
    <radialGradient id="qt-glow" cx="0.2" cy="0.85" r="0.9">
      <stop offset="0" stop-color="#ff9f0a" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ff375f" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ff375f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qt-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9f0a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#qt-bg)"/>
  <rect width="1200" height="750" fill="url(#qt-glow)"/>

  <circle cx="46" cy="44" r="7" fill="#ff5f57"/>
  <circle cx="72" cy="44" r="7" fill="#febc2e"/>
  <circle cx="98" cy="44" r="7" fill="#28c840"/>
  <text x="150" y="50" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#6a5a48">qtnet — training</text>

  <!-- reward chart -->
  <g stroke="#ffffff" stroke-opacity="0.06">
    <line x1="140" y1="180" x2="720" y2="180"/>
    <line x1="140" y1="290" x2="720" y2="290"/>
    <line x1="140" y1="400" x2="720" y2="400"/>
    <line x1="140" y1="510" x2="720" y2="510"/>
  </g>
  <!-- axes -->
  <line x1="140" y1="160" x2="140" y2="540" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <line x1="140" y1="540" x2="720" y2="540" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <text x="120" y="200" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6a5a48" text-anchor="end">reward</text>

  <!-- noisy rising reward curve -->
  <path d="M150 500 L190 470 L230 488 L270 440 L310 452 L350 408 L390 420 L430 372 L470 360 L510 322 L550 332 L590 286 L630 270 L670 240 L700 226 L700 540 L150 540 Z" fill="url(#qt-area)"/>
  <polyline points="150,500 190,470 230,488 270,440 310,452 350,408 390,420 430,372 470,360 510,322 550,332 590,286 630,270 670,240 700,226" fill="none" stroke="#ff9f0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ff375f">
    <circle cx="350" cy="408" r="5"/><circle cx="510" cy="322" r="5"/><circle cx="630" cy="270" r="5"/><circle cx="700" cy="226" r="6"/>
  </g>

  <!-- neural net (actor-critic) panel -->
  <rect x="800" y="160" width="340" height="420" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="828" y="200" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#7b7060">GRU actor-critic</text>
  <g stroke="#ff9f0a" stroke-opacity="0.4" stroke-width="1.6">
    <line x1="860" y1="270" x2="970" y2="250"/><line x1="860" y1="270" x2="970" y2="330"/><line x1="860" y1="270" x2="970" y2="410"/>
    <line x1="860" y1="370" x2="970" y2="250"/><line x1="860" y1="370" x2="970" y2="330"/><line x1="860" y1="370" x2="970" y2="410"/>
    <line x1="860" y1="470" x2="970" y2="330"/><line x1="860" y1="470" x2="970" y2="410"/>
    <line x1="970" y1="250" x2="1080" y2="310"/><line x1="970" y1="330" x2="1080" y2="310"/><line x1="970" y1="410" x2="1080" y2="310"/>
    <line x1="970" y1="250" x2="1080" y2="430"/><line x1="970" y1="330" x2="1080" y2="430"/><line x1="970" y1="410" x2="1080" y2="430"/>
  </g>
  <g fill="#1b1712" stroke="#ff9f0a" stroke-width="2">
    <circle cx="860" cy="270" r="16"/><circle cx="860" cy="370" r="16"/><circle cx="860" cy="470" r="16"/>
    <circle cx="970" cy="250" r="16"/><circle cx="970" cy="330" r="16"/><circle cx="970" cy="410" r="16"/>
  </g>
  <circle cx="1080" cy="310" r="18" fill="#ff9f0a"/>
  <circle cx="1080" cy="430" r="18" fill="#ff375f"/>
  <text x="1062" y="478" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#7b7060">π   V</text>

  <text x="140" y="660" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#8a93a3">QTNet</text>
  <text x="140" y="692" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#4d5563">deep-RL trading · GRU actor-critic · walk-forward backtest</text>
</svg>
